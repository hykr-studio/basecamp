name: agentic-stack-template
services:
  postgres:
    # multi-arch (amd64 + arm64) build of postgis/postgis, which ships amd64 only
    image: ${POSTGRES_IMAGE:-imresamu/postgis:17-3.5}
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d app"], interval: 5s, retries: 20 }
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
  minio:
    # MinIO no longer publishes free images (quay.io/minio/minio now 401s); Chainguard's build is multi-arch
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: server /data --console-address ":9001"
    volumes: ["miniodata:/data"]
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["5050:80"]
    volumes: ["./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro"]
    depends_on: { postgres: { condition: service_healthy } }
  # WhatsApp Cloud API emulator: chat UI at http://localhost:8080
  # SQLite defaults to memory. To keep chats across restarts, mount a volume and set
  # WHALOC_DB_PATH=/data/whaloc.db (the image declares /data; the process runs as uid 1000).
  whaloc:
    image: ghcr.io/dgadelha/whaloc:latest # pin a digest: the project is new
    environment:
      WHALOC_WEBHOOK_URL: http://host.docker.internal:3000/webhooks/whatsapp
      WHALOC_APP_SECRET: dev-app-secret
      WHALOC_WEBHOOK_VERIFY_TOKEN: dev-verify-token
    ports: ["8080:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"] # lets it reach the API on your Mac (and on Linux CI)
volumes: { pgdata: {}, miniodata: {} }

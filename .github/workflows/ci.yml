name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # GitHub's runners are amd64, where postgis/postgis has images.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
      # Email, for notifications WhatsApp can't deliver (the notification tests read it).
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]

    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      MIGRATE_DATABASE_URL: postgres://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGINS: http://localhost:8081
      API_INTERNAL_URL: http://localhost:3000
      # Test values only (32+ characters); nothing real runs in CI.
      BETTER_AUTH_SECRET: ci-better-auth-secret-0123456789abcdef
      AGENT_API_KEY: ci-agent-api-key-0123456789abcdef0123
      VOICE_AGENT_KEY: ci-voice-agent-key-0123456789abcdef01
      APPROVAL_SECRET: ci-approval-secret-0123456789abcdef0123
      # The scripted model: no OpenRouter key, no cost, same answers every run.
      MODEL_MODE: fake
      VOICE_MODE: fake
      GUARDRAILS: "off"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json's packageManager

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare the database (extensions, search path)
        run: psql postgres://app:app@localhost:5432/app -v ON_ERROR_STOP=1 -f framework/cli/infra/postgres/init.sql

      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint:deps
      - run: pnpm db:migrate
      - run: pnpm test

  # The framework as a user gets it: every @hykr/* package packed as it would be published, a
  # new application scaffolded with create-basecamp, installed from those tarballs (no
  # workspace links), then built and typechecked.
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./framework/*"

      - name: Pack the framework
        run: |
          mkdir -p "$RUNNER_TEMP/tgz"
          for dir in framework/*/; do (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/tgz"); done

      - name: Scaffold an application from the packed create-basecamp
        working-directory: ${{ runner.temp }}
        run: |
          mkdir cb && tar xzf tgz/hykr-create-basecamp-*.tgz -C cb
          node cb/package/dist/index.js myapp
          # The tarballs stand in for the registry.
          { echo; echo "overrides:"; for t in "$RUNNER_TEMP"/tgz/hykr-*.tgz; do
              n=$(basename "$t" .tgz | sed 's/^hykr-//; s/-[0-9.]*$//')
              echo "  \"@hykr/$n\": \"file:$t\""
            done; } >> myapp/pnpm-workspace.yaml

      - name: Install, build and typecheck it
        working-directory: ${{ runner.temp }}/myapp
        run: |
          pnpm install
          pnpm -r build
          pnpm -r typecheck
          pnpm exec basecamp --help
